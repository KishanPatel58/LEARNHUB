<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact Us</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
    <link rel="stylesheet" href="../static/css/style.css">
    <link rel="shortcut icon" href="../static/images/open-book.jpg" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .contact-container {
            background-color: #1a1a1a;
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 0 25px rgba(218, 55, 10, 0.315);
        }

        .contact-container h2 {
            color: #DA360A;
            margin-bottom: 25px;
            text-align: center;
            font-family: 'font8';
            font-size: 2.3rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #ccc;
            font-size: 14px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #333;
            background-color: #111;
            color: #fff;
            outline: none;
            transition: 0.3s ease;
            font-size: 14px;
        }

        input:focus,
        textarea:focus {
            border-color: #DA360A;
            box-shadow: 0 0 8px rgba(218, 54, 10, 0.4);
        }

        textarea {
            resize: none;
            height: 120px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            outline: none;
            border-radius: 6px;
            background-color: #DA360A;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s ease;
        }

        button:hover {
            background-color: #b92c08;
            transform: translateY(-2px);
        }

        /* Responsive */
        @media (max-width: 480px) {
            .contact-container {
                padding: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="contact-container">
        <h2>Contact Us</h2>

        <form id="contact-form">

            <div class="form-group">
                <label>Username</label>
                <input type="text" id="nameinput" name="from_name" required placeholder="John Doe">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="emailinput" name="from_email" required placeholder="john@gmail.com">
            </div>

            <div class="form-group">
                <label>Message</label>
                <textarea name="message" id="messageinput" required placeholder="Hello! 👋"></textarea>
            </div>

            <button id="submitbtn" type="submit">Send Message</button>

        </form>
    </div>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script type="text/javascript">
        (function () {
            // https://dashboard.emailjs.com/admin/account
            emailjs.init({
                publicKey: "eZ8ckA-IQI-C2yKJ6",
            });
        })();
    </script>
    <script type="text/javascript">
        window.onload = function () {
            document.getElementById('contact-form').addEventListener('submit', function (event) {
                event.preventDefault();
                // these IDs from the previous steps
                emailjs.sendForm('service_3bwny1n', 'template_8g2r6oz', this)
                    .then(() => {
                        const btn = document.getElementById("submitbtn");
                        btn.style.backgroundColor = "#198754";
                        btn.innerHTML = 'Messege Send Successfully <i class="ri-shield-check-line"></i>'
                        const usname = document.getElementById("nameinput");
                        const email = document.getElementById("emailinput");
                        const message = document.getElementById("messageinput");
                        usname.value="";
                        email.value="";
                        message.value="";
                    }, (error) => {
                        console.log('FAILED...', error);
                    });
            });
        }
    </script>
</body>

</html>
