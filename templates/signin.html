<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #050505; color: white; }
        .glass-box { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <div class="glass-box p-12 rounded-[2.5rem] w-full max-w-md shadow-2xl">
        <h1 class="text-3xl text-center font-black mb-2 tracking-tighter">Welcome Back.</h1>

        {% if error %}
        <div class="bg-red-500/10 border border-red-500/50 text-red-500 p-4 rounded-xl mb-6 text-sm">
            {{ error }}
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-6">
            <div>
                <label class="block text-xs font-bold uppercase tracking-widest text-gray-400 mb-2">Email Address</label>
                <input type="email" name="email" required 
                    class="w-full bg-white/5 border border-white/10 p-4 rounded-xl focus:outline-none focus:border-indigo-500 transition">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-widest text-gray-400 mb-2">Password</label>
                <input type="password" name="password" required 
                    class="w-full bg-white/5 border border-white/10 p-4 rounded-xl focus:outline-none focus:border-indigo-500 transition">
            </div>

            <button type="submit" 
                class="w-full bg-indigo-600 hover:bg-indigo-500 py-4 rounded-2xl font-bold shadow-lg shadow-indigo-600/20 transition duration-300">
                Sign In
            </button>
        </form>

        <p class="text-center mt-8 text-gray-500 text-sm">
            Don't have an account? <a href="#" class="text-indigo-400 hover:underline">Register</a>
        </p>
    </div>

</body>
</html>
